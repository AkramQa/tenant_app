name: tenant_app
description: "Tenant mobile application — Flutter take-home assignment."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

# Models (freezed), API clients (retrofit) and forms (reactive_forms_generator)
# are generated. Generated files are committed; regenerate with ./scripts/generate.sh.

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # STATE MANAGEMENT + DI
  flutter_riverpod: ^3.0.0

  # NAVIGATION
  go_router: ^16.2.0

  # NATIVE HELPERS
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2

  # NETWORKING
  dio: ^5.11.1
  retrofit: '>=4.9.0 <4.10.0' # 4.10 breaks retrofit_generator 9.7
  internet_connection_checker_plus: ^2.7.2

  # DATA
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  hive: ^2.2.3
  uuid: ^4.5.1
  equatable: ^2.0.7
  intl: any
  dartz: ^0.10.1
  logger: ^2.5.0

  # FORMS
  reactive_forms: '>=18.1.1 <18.2.0' # 18.2 changes errors type used by reactive_forms_generator 8.0
  reactive_forms_annotations: '>=8.0.1 <8.1.0' # must match reactive_forms_generator 8.0.x

  # UI
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.1
  separated_column: ^3.0.4
  separated_row: ^3.0.4
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_flavorizr: ^2.6.0
  build_runner: ^2.5.4
  intl_utils: ^2.8.11
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  retrofit_generator: ^9.7.0
  reactive_forms_generator: ^8.0.3
  # Same codegen stack as Ulearna: reactive_forms_generator 8.0.x needs analyzer 7.
  analyzer: ^7.3.0

flutter:
  # --flavor is required. Uncomment to let plain `flutter run` default to dev.
  # default-flavor: dev
  uses-material-design: true

# Run command: dart run intl_utils:generate (./scripts/generate_localizations.sh)
flutter_intl:
  enabled: true

# Run command: dart run flutter_flavorizr (./scripts/project_setup.sh)
flavorizr:
  flavors:
    dev:
      app:
        name: "Tenant Hub Dev"
      android:
        applicationId: "com.tenantapp.tenant_app.dev"
      ios:
        bundleId: "com.tenantapp.tenantApp.dev"
        variables:
          FLUTTER_TARGET:
            value: "lib/main.dart"
    stg:
      app:
        name: "Tenant Hub Stg"
      android:
        applicationId: "com.tenantapp.tenant_app.stg"
      ios:
        bundleId: "com.tenantapp.tenantApp.stg"
        variables:
          FLUTTER_TARGET:
            value: "lib/main.dart"
    prod:
      app:
        name: "Tenant Hub"
      android:
        applicationId: "com.tenantapp.tenant_app"
      ios:
        bundleId: "com.tenantapp.tenantApp"
        variables:
          FLUTTER_TARGET:
            value: "lib/main.dart"
  instructions:
    - assets:download
    - assets:extract
    - android:flavorizrGradle
    - android:buildGradle
    - ios:xcconfig
    - assets:clean
