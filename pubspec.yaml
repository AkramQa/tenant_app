name: tenant_app
description: "Tenant mobile application — Flutter take-home assignment."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # STATE MANAGEMENT + DI
  flutter_riverpod: ^3.0.0

  # NATIVE HELPERS
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2

  # NETWORKING
  internet_connection_checker_plus: ^2.7.2

  # DATA
  hive: ^2.2.3
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  dartz: ^0.10.1
  logger: ^2.5.0

  # FORMS
  reactive_forms: ^18.1.1
  reactive_forms_annotations: ^8.0.1

  # UI
  auto_route: ^9.0.0
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.1
  separated_column: ^3.0.4
  separated_row: ^3.0.4
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  auto_route_generator: ^9.0.0
  reactive_forms_generator: ^8.0.3
  intl_utils: ^2.8.11
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/translations/

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  main_locale: en
  arb_dir: assets/translations
  output_dir: lib/gen/localizations_generated
